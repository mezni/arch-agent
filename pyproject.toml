[project]
name = "my-ai-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.17.0",
]

[tool.ruff]
# Target Python version
target-version = "py38"
line-length = 88

[tool.ruff.lint]
# Select specific lint rules (e.g., Pyflakes [F], pycodestyle [E/W], isort [I])
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
